events {
    worker_connections 1024;
}

http {
    # Lua package path for OpenResty modules
    lua_package_path "/usr/local/openresty/lualib/?.lua;;";
    
    # Upstream MCP server (unchanged)
    upstream mcp-server {
        server localhost:3000;
    }
    
    # Main proxy server with auth
    server {
        listen 8080;
        
        # Health check - no auth required
        location /health {
            proxy_pass http://mcp-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Auth endpoint (internal) - handle auth inline
        location /auth {
            internal;
            access_by_lua_file /etc/nginx/auth.lua;
            # Return empty response for auth_request
            return 200 "";
        }
        
        # All other endpoints require Bearer token
        location / {
            # Authenticate using internal auth endpoint
            auth_request /auth;
            
            # Pass auth headers to upstream  
            auth_request_set $user $upstream_http_x_remote_user;
            auth_request_set $user_uid $upstream_http_x_remote_user_uid;
            auth_request_set $groups $upstream_http_x_remote_groups;
            
            # Forward to MCP server with original auth header
            proxy_pass http://mcp-server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            
            # Add user context headers (optional, for MCP server)
            proxy_set_header X-Remote-User $user;
            proxy_set_header X-Remote-User-UID $user_uid;
            proxy_set_header X-Remote-Groups $groups;
            
            # SSE specific settings for /sse endpoint
            proxy_buffering off;
            proxy_cache off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            
            # Increase timeouts for long-lived connections
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 300s;  # 5 minutes for SSE
        }
    }
}