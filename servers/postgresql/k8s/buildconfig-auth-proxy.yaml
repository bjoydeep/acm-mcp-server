apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: auth-proxy
  namespace: mcp-server
spec:
  output:
    to:
      kind: ImageStreamTag
      name: auth-proxy:latest
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  triggers:
    - type: ConfigChange
  runPolicy: Serial
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: auth-proxy
  namespace: mcp-server
spec:
  lookupPolicy:
    local: true