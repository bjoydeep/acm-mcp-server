apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-mcp-server
  namespace: mcp-server
  labels:
    app: postgres-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-mcp-server
  template:
    metadata:
      labels:
        app: postgres-mcp-server
    spec:
      containers:
      - name: postgres-mcp-server
        image: image-registry.openshift-image-registry.svc:5000/mcp-server/postgres-mcp-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgres-mcp-secret
              key: database-url
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-mcp-server-service
  namespace: mcp-server
  labels:
    app: postgres-mcp-server
spec:
  selector:
    app: postgres-mcp-server
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: postgres-mcp-server-route
  namespace: mcp-server
  labels:
    app: postgres-mcp-server
spec:
  to:
    kind: Service
    name: postgres-mcp-server-service
  port:
    targetPort: http
  tls:
    termination: edge 