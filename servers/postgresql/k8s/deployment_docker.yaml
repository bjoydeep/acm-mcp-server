apiVersion: apps/v1
kind: Deployment
metadata:
  name: acm-search-mcp-server
  namespace: acm-search
  labels:
    app: acm-search-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: acm-search-mcp-server
  template:
    metadata:
      labels:
        app: acm-search-mcp-server
    spec:
      serviceAccountName: acm-search-mcp-server
      containers:
      # Auth proxy sidecar
      - name: auth-proxy
        image: quay.io/bjoydeep/acm-search-auth-proxy:latest
        ports:
        - containerPort: 8080
          name: public
        # Service account token is automatically mounted at /var/run/secrets/kubernetes.io/serviceaccount
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
            
      # Main MCP server (unchanged)
      - name: postgres-mcp-server
        image: quay.io/bjoydeep/acm-search-mcp-server:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: acm-search-mcp-secret
              key: database-url
        - name: PORT
          value: "3000"
        - name: NODE_ENV
          value: "production"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10

      # No volumes needed - service account token is automatically mounted
---
apiVersion: v1
kind: Service
metadata:
  name: acm-search-mcp-server-service
  namespace: acm-search
  labels:
    app: acm-search-mcp-server
spec:
  selector:
    app: acm-search-mcp-server
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: acm-search-mcp-server-route
  namespace: acm-search
  labels:
    app: acm-search-mcp-server
spec:
  to:
    kind: Service
    name: acm-search-mcp-server-service
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect