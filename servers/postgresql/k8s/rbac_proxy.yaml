# RBAC for auth proxy - needs token validation permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: auth-proxy-minimal
  labels:
    app: postgres-mcp-server-proxy
rules:
# Auth proxy needs to validate tokens - REQUIRED
- apiGroups: ["authentication.k8s.io"]
  resources: ["tokenreviews"]
  verbs: ["create"]
# Auth proxy needs to get user info - OPTIONAL (for enhanced user context)
- apiGroups: ["user.openshift.io"]
  resources: ["users"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-mcp-server-proxy-minimal
  labels:
    app: postgres-mcp-server-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: auth-proxy-minimal
subjects:
- kind: ServiceAccount
  name: postgres-mcp-server-proxy
  namespace: mcp-server