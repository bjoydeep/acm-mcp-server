apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-mcp-server-proxy
  namespace: mcp-server
  labels:
    app: postgres-mcp-server-proxy
automountServiceAccountToken: true
---
# Service account for MCP clients (Claude Code, etc.)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-client-proxy
  namespace: mcp-server
  labels:
    app: postgres-mcp-server-proxy
    component: client
  annotations:
    openshift.io/description: "Service account for MCP clients like Claude Code - Proxy auth"
automountServiceAccountToken: true
---
# Long-lived token secret for MCP clients
apiVersion: v1
kind: Secret
metadata:
  name: mcp-client-proxy-token
  namespace: mcp-server
  labels:
    app: postgres-mcp-server-proxy
    component: client
  annotations:
    kubernetes.io/service-account.name: mcp-client-proxy
    openshift.io/description: "Long-lived token for MCP client proxy authentication"
type: kubernetes.io/service-account-token